  - name: KNIME
    buildsystem: simple
    build-options:
      env:
        PATH: ${PATH}:/app/bin:/usr/bin:/usr/lib/sdk/openjdk17/bin
        #MAVEN_OPTS: -Dmaven.repo.local=.m2/repository
        JAVA_HOME: /usr/lib/sdk/openjdk17/jvm/openjdk-17
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/knime
      - mkdir -p /app/bin
      - cp {README.txt,LICENSE.TXT} ${FLATPAK_DEST}/share/knime
      - install -Dm0744 {knime,knime.ini} /app/bin
      - cp -r plugins /app/bin
      - install -Dm0644 com.knime.KNIME.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm0644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      #- ldd /app/bin/knime
      #- /app/bin/knime
    sources:
      - type: archive
        url: https://download.knime.org/analytics-platform/linux/knime_4.6.0.linux.gtk.x86_64.tar.gz
        sha256: 2ad3e23121a89754d8634003afebc160f9691704d6f84f4091aef9c1a7901382
      - type: file
        path: com.knime.KNIME.png
      - type: file
        path: com.knime.KNIME.desktop
      - type: file
        path: com.knime.KNIME.metainfo.xml

