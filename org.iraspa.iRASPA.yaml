app-id: org.iraspa.iRASPA
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.9'
#base: io.qt.qtwebengine.BaseApp
#base-version: 5.15-21.08
#rename-icon: iraspa
command: iraspa
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
cleanup:
  - '*.la'
  - '*.a'
modules:
  - name: OpenCL-Headers
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/OpenCL-Headers.git
        tag: v2025.07.22
        commit: 8a97ebc88daa3495d6f57ec10bb515224400186f
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

  - name: iRASPA-QT
    buildsystem: cmake-ninja
    builddir: _build
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: iRASPA-QT
