  - name: Gazebo-icon-desktop
    buildsystem: simple
    build-commands:
      # gz-sim has a desktop template, but it uses /usr/bin/gz and the
      # versioned upstream icon name. Keep the Flatpak-specific desktop file.
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      # gz-sim does not ship metainfo/appdata, so keep the local AppStream file.
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.gazebosim.Gazebo.metainfo.xml
      - type: file
        path: org.gazebosim.Gazebo.desktop

  - name: Gazebo-wrapper
    buildsystem: simple
    build-commands:
      - install run-gazebo.sh /app/bin/
      # The classic OGRE font definition installed by gz-rendering contains
      # bare names with spaces, which OGRE parses as multiple tokens. Quote
      # those names so classic-ogre fallback resources remain usable.
      - sed -i 's/^\([A-Z][a-zA-Z]* [A-Za-z].*\)$/font "\1"/' /app/share/gz/gz-rendering/ogre/media/fonts/gz-rendering.fontdef
      - sed -i 's/^\([A-Z][a-zA-Z]*\)$/font \1/' /app/share/gz/gz-rendering/ogre/media/fonts/gz-rendering.fontdef
      # Some classic OGRE materials referenced by gz-rendering expect the
      # ShadowVolume programs in Gazebo's resource tree rather than OGRE's.
      - cp /app/share/OGRE/Media/ShadowVolume/* /app/share/gz/gz-rendering/ogre/media/materials/programs/
      # Older SDF worlds still reference ignition-gazebo plugin names. gz-sim10
      # installs the same systems as libgz-sim-*-system.so, so expose stable
      # compatibility symlinks instead of patching bundled or user worlds.
      - for plugin in /app/lib/gz-sim-10/plugins/libgz-sim-*-system.so; do ln -sf "$(basename "${plugin}")" "${plugin%/*}/$(basename "${plugin}" | sed 's/^libgz-sim-/libignition-gazebo-/')"; done
    sources:
      - type: script
        dest-filename: run-gazebo.sh
        commands:
          - |
            if [ -f /app/setup.sh ]; then
              . /app/setup.sh
            fi
            # Host session managers can advertise non-local ICE addresses inside
            # the sandbox; unsetting avoids noisy Qt session-management errors.
            unset SESSION_MANAGER

            # Gazebo does not search all Flatpak install locations by default.
            # Point each plugin/resource loader at the versioned /app paths.
            export GZ_CONFIG_PATH=/app/share/gz
            export GZ_IP=127.0.0.1
            export GZ_SIM_RESOURCE_PATH=/app/share/gz:${GZ_SIM_RESOURCE_PATH}
            export GZ_SIM_SYSTEM_PLUGIN_PATH=/app/lib/gz-sim-10/plugins:${GZ_SIM_SYSTEM_PLUGIN_PATH}
            export GZ_SIM_RENDER_ENGINE_PATH=/app/lib/gz-rendering-10/engine-plugins:${GZ_SIM_RENDER_ENGINE_PATH}
            export GZ_SIM_PHYSICS_ENGINE_PATH=/app/lib/gz-physics-9/engine-plugins:${GZ_SIM_PHYSICS_ENGINE_PATH}
            export GZ_RENDERING_RESOURCE_PATH=/app/share/gz/gz-rendering
            export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:/app/lib/gz-sim-10/plugins:/app/lib/gz-rendering-10/engine-plugins:/app/lib/gz-physics-9/engine-plugins

            # Prefer the Ogre2 renderer now that Ogre-Next is bundled, but
            # preserve explicit user choices such as --render-engine ogre.
            render_engine_set=0
            for arg in "$@"; do
              case "$arg" in
                --render-engine|--render-engine=*|--render-engine-gui|--render-engine-gui=*|--render-engine-server|--render-engine-server=*)
                  render_engine_set=1
                  ;;
              esac
            done

            if [ "$render_engine_set" -eq 0 ]; then
              exec /app/libexec/gz/sim10/gz-sim-main --render-engine ogre2 "$@"
            fi
            exec /app/libexec/gz/sim10/gz-sim-main "$@"
