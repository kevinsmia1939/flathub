app-id: org.gazebosim.Gazebo
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '6.10'
command: run-gazebo.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --share=network

cleanup:
  #- /include
  - /lib/cmake
  - /share/doc
  - /doc
  - '*.la'
  - '*.a'
  # Keep /usr out of the exported app to avoid appstream-glib icon lookup
  # failures when metadata validation scans runtime-side icon locations.
  # https://github.com/hughsie/appstream-glib/issues/271
  - /usr

modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - shared-modules/libusb/libusb.json

    # For FreeImage
    # FreeImage need -fPIC
    # CMakeLists.txt from https://build.opensuse.org/package/show/graphics/jxrlib
  - name: libjxr
    buildsystem: cmake-ninja
    build-options:
      cflags: -fPIC -Wno-implicit-function-declaration -Wno-incompatible-pointer-types
      cxxflags: -fPIC -Wno-implicit-function-declaration -Wno-incompatible-pointer-types
    sources:
      - type: archive
        url: https://github.com/4creators/jxrlib/archive/refs/tags/v2019.10.9.tar.gz
        sha256: 555c006e27c5cb66f99c05dcbb2feb197199ca9018dbd06d3467d37cd29a79cd
        x-checker-data:
          type: json
          url: https://api.github.com/repos/4creators/jxrlib/tags
          version-query: map(.name) | map(select(test("^v[\\d.]+$"))) | .[0] | sub("^v";
            "")
          url-query: '"https://github.com/4creators/jxrlib/archive/refs/tags/v" +
            $version + ".tar.gz"'
      - type: file
        path: JXR-CMakeLists.txt
        dest-filename: CMakeLists.txt

    # For FreeImage
  - name: LibRaw
    buildsystem: simple
    build-commands:
      - autoreconf -vfi
      - ./configure --disable-example --enable-lcms --prefix=/app
      - make
      - make install
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.22.1.tar.gz
        sha256: a789dc4e2409e2901d93793a4e0b80c7b49d0d97cf6ad71c850eb7616acfd786
        x-checker-data:
          type: anitya
          project-id: 1709
          stable-only: true
          url-template: https://www.libraw.org/data/LibRaw-$version.tar.gz
    cleanup:
      - /bin
      - /share/doc

  - name: Imath
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING:BOOL=OFF
    sources:
      - type: git
        url: https://github.com/AcademySoftwareFoundation/Imath.git
        tag: v3.2.2
        commit: 1e480d11cb98b032a2dece9b9a8730512effc7f6
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

   # For FreeImage
  - name: openEXR
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING:BOOL=OFF
    sources:
      - type: git
        url: https://github.com/AcademySoftwareFoundation/openexr.git
        tag: v3.4.10
        commit: 67de2bffbd7da508f75fbdc56e6e551a4e31fb83
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

    # Use methods, patch, and build flags from openSUSE.
    # https://build.opensuse.org/package/show/openSUSE:Factory/freeimage
  - name: FreeImage
    build-options:
      cflags: -I/app/include/jxrlib -I/app/include -I/usr/include -fpermissive -O2
        -Wall -D_FORTIFY_SOURCE=2 -fstack-protector-strong -funwind-tables -fasynchronous-unwind-tables
        -fstack-clash-protection -Werror=return-type -flto=auto -fPIC -Wunused-variable
      cxxflags: -I/app/include/jxrlib -I/app/include -I/usr/include -fpermissive -O2
        -Wall -D_FORTIFY_SOURCE=2 -fstack-protector-strong -funwind-tables -fasynchronous-unwind-tables
        -fstack-clash-protection -Werror=return-type -flto=auto -fPIC -Wunused-variable
    buildsystem: simple
    build-commands:
      - rm -rf Source/LibPNG/ Source/LibRawLite/ Source/OpenEXR/ Source/ZLib/ Source/LibOpenJPEG/
        Source/LibJPEG/
      - truncate -s 0 Source/FreeImageToolkit/JPEGTransform.cpp
      - truncate -s 0 Source/FreeImage/PluginG3.cpp
      - for file in `find . -type f -name '*.c' -or -name '*.cpp' -or -name '*.h'
        -or -name '*.txt' -or -name Makefile`; do iconv --from=ISO-8859-15 --to=UTF-8
        $file > $file.new && sed -i 's|\r||g' $file.new && touch -r $file $file.new
        && mv $file.new $file; done
      - sh ./gensrclist.sh
      - sh ./genfipsrclist.sh
      - make -f Makefile.gnu
      - make -f Makefile.fip
      - make install
      - make -f Makefile.fip DESTDIR=/app INSTALLDIR=/app/lib install
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/freeimage/FreeImage3180.zip
        sha256: f41379682f9ada94ea7b34fe86bf9ee00935a3147be41b6569c9605a53e438fd
        x-checker-data:
          type: anitya
          project-id: 10655
          stable-only: true
          url-template: http://downloads.sourceforge.net/freeimage/FreeImage${major}${minor}${patch}.zip
      - type: patch
        path: FreeImage_patch/freeimage_flatpak_dest.patch
      - type: patch
        path: FreeImage_patch/unbundle.patch
      - type: patch
        path: FreeImage_patch/doxygen.patch
        strip-components: 0
      - type: patch
        path: FreeImage_patch/makefiles_fixes.patch
      - type: patch
        path: FreeImage_patch/freeimage-no-return-in-nonvoid.patch
      - type: patch
        path: FreeImage_patch/CVE-2019-12211_2019-12213.patch
      - type: patch
        path: FreeImage_patch/bigendian.patch
      - type: patch
        path: FreeImage_patch/libraw_0_20.patch
      - type: shell
        commands:
          - sed -i '/(-s \[0\.\.N-1\]) Select one raw image/d' Source/FreeImage/PluginRAW.cpp
          - sed -i '/imgdata\.params\.shot_select/d' Source/FreeImage/PluginRAW.cpp
      - type: patch
        path: FreeImage_patch/freeimage-openexr3.patch
      - type: shell
        commands:
          - grep -rl '_TIFFDataSize' Source/ | xargs sed -i 's/_TIFFDataSize/TIFFDataWidth/g'

