  # Ogre-Next's JSON support uses RapidJSON. The last RapidJSON release needs
  # a small GCC 15 fix because GenericStringRef's default assignment writes to
  # a const member and newer libstdc++ rejects that during Ogre-Next builds.
  - name: rapidjson
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DRAPIDJSON_BUILD_DOC=OFF
      - -DRAPIDJSON_BUILD_EXAMPLES=OFF
      - -DRAPIDJSON_BUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/Tencent/rapidjson/archive/refs/tags/v1.1.0.tar.gz
        sha256: bf7ced29704a1e696fbccf2a2b4ea068e7774fa37f6d7dd4039d0787f8bed98e
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: patch
        path: fix-rapidjson-gcc15-generic-string-ref.patch

  # Gazebo Jetty / gz-rendering10 supports the Ogre2 backend through
  # Ogre-Next 2.3.x. Keep DOGRE_USE_NEW_PROJECT_NAME enabled so gz-cmake's
  # FindGzOGRE2.cmake can locate the OGRE-Next pkg-config / CMake package
  # names used by upstream Ogre-Next on Linux.
  - name: Ogre-Next
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE:STRING=Release
      - -DCMAKE_INSTALL_PREFIX:PATH=/app
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DOGRE_USE_NEW_PROJECT_NAME:BOOL=TRUE
      - -DOGRE_INSTALL_DOCS:BOOL=FALSE
      - -DOGRE_INSTALL_SAMPLES:BOOL=FALSE
      - -DOGRE_INSTALL_SAMPLES_SOURCE:BOOL=FALSE
      - -DOGRE_INSTALL_TOOLS:BOOL=FALSE
      - -DOGRE_BUILD_TESTS:BOOL=FALSE
      - -DOGRE_BUILD_SAMPLES2:BOOL=FALSE
      - -DOGRE_BUILD_TOOLS:BOOL=FALSE
      - -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS:BOOL=TRUE
      - -DOGRE_BUILD_RENDERSYSTEM_VULKAN:BOOL=FALSE
      - -DOGRE_BUILD_COMPONENT_HLMS_PBS:BOOL=TRUE
      - -DOGRE_BUILD_COMPONENT_HLMS_UNLIT:BOOL=TRUE
      - -DOGRE_BUILD_COMPONENT_PLANAR_REFLECTIONS:BOOL=TRUE
      - -DOGRE_BUILD_COMPONENT_OVERLAY:BOOL=TRUE
      - -DOGRE_CONFIG_ENABLE_JSON:BOOL=TRUE
      - -DOGRE_CONFIG_ENABLE_FREEIMAGE:BOOL=TRUE
      # gz-rendering loads resources from installed directories, so zip
      # archives and TBB are unnecessary here and add extra dependency surface.
      - -DOGRE_CONFIG_ENABLE_ZIP:BOOL=FALSE
      - -DOGRE_CONFIG_ENABLE_TBB_SCHEDULER:BOOL=FALSE
      - -DOGRE_USE_BOOST:BOOL=FALSE
    sources:
      - type: git
