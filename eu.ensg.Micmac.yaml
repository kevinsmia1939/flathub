app-id: eu.ensg.Micmac
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: 5.15-21.08
command: MICMAC
#For CastXML
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm13
# GLEW does not support Wayland yet.
#build-options:
  #cflags: -O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong -funwind-tables -fasynchronous-unwind-tables -fstack-clash-protection
  #cxxflags: -O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong -funwind-tables -fasynchronous-unwind-tables -fstack-clash-protection
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=home
cleanup:
  #- /include
  #- /lib/cmake
  #- /share/doc
  - '*.la'
  - '*.a'

modules:
  - shared-modules/glu/glu-9.json

  - name: Boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install --build-type=complete link=shared --layout=versioned runtime-link=shared cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://boostorg.jfrog.io/artifactory/main/release/1.76.0/source/boost_1_76_0.tar.bz2
        sha256: f0397ba6e982c4450f27bf32a2a83292aba035b827a5623a14636ea583318c41
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://boostorg.jfrog.io/artifactory/main/release/$version/source/boost_${major}_${minor}_${patch}.tar.bz2

  - name: Micmac
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE:STRING=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DBUILD_PATH_BIN=/app/bin
      - -DBUILD_PATH_LIB=/app/lib
      - -DWERROR:BOOL=OFF
      - -DWITH_CCACHE:BOOL=ON
      - -DWITH_CPP11:BOOL=ON
      - -DWITH_DOXYGEN:BOOL=OFF
      - -DWITH_ETALONPOLY:BOOL=ON
      - -DWITH_GIMMI:BOOL=ON
      - -DWITH_GRAPHVIZ:BOOL=OFF
      - -DWITH_HEADER_PRECOMP:BOOL=ON
      - -DWITH_IGN_IMAGE:BOOL=ON
      - -DWITH_IGN_ORI:BOOL=ON
      - -DWITH_INTERFACE:BOOL=ON
      - -DWITH_KAKADU:BOOL=OFF
      - -DWITH_OPENCL:BOOL=OFF
      - -DWITH_OPEN_MP:BOOL=OFF
      - -DWITH_QT5:BOOL=ON
    post-install:
      - ls -l $FLATPAK_BUILDER_BUILDDIR
    sources:
      - type: git
        url: https://github.com/micmacIGN/micmac.git
        commit: master
        #commit: f5bb010a4a5d9de63a287e012de37f1f49fdbd15
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$
      #- type: patch
        #path: qt5_interface.patch

  - name: findbin
    buildsystem: simple
    build-commands:
      - ls -l /app/bin
