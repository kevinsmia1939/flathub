      #sha256: ff138b2b6ed2b700b04b406be718df213052d4c952190280cf4e2fab4b61fe09

  - name: Rack2
    build-options:
      ldflags: -L/app/lib/
      #env:
        #LIBRARY_PATH: "/app/lib:dep/lib/"
        #LD_LIBRARY_PATH: "/app/lib:dep/lib/"
    buildsystem: simple
    build-commands:
      - cp -r dep/pffft/*h ${FLATPAK_DEST}/include
      - cp -r dep/oui-blendish/*h ${FLATPAK_DEST}/include
      - cp -r dep/osdialog/*h ${FLATPAK_DEST}/include
      - cp -r dep/nanovg/src/*h ${FLATPAK_DEST}/include
      - cp -r dep/nanovg/example/stb_image_write.h ${FLATPAK_DEST}/include
      - cp -r dep/nanosvg/src/*h ${FLATPAK_DEST}/include
      - cp -r dep/fuzzysearchdatabase/src/FuzzySearchDatabase.hpp ${FLATPAK_DEST}/include
      - cp -r dep/filesystem/include/ghc ${FLATPAK_DEST}/include
      - 'export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:dep/lib/'
      - mkdir -p dep/rtaudio/build && cd dep/rtaudio/build && cmake .. -DRTAUDIO_BUILD_STATIC_LIBS=ON -DRTAUDIO_BUILD_TESTING=OFF -DRTAUDIO_API_ALSA=ON -DRTAUDIO_API_JACK=ON -DRTAUDIO_API_PULSE=ON -DRTAUDIO_API_OSS=OFF -DCMAKE_INSTALL_PREFIX=/app && cd .. && make -C build && make -C build install
      - mkdir -p dep/rtmidi && cd dep/rtmidi && ./autogen.sh --no-configure && ./configure --prefix=/app --enable-shared=no --with-alsa --with-jack && cd .. && make -C rtmidi && make -C rtmidi install
      - make
      - make run
    sources:
      - type: git
        url: https://github.com/VCVRack/Rack
        #branches: v2
        commit: 30665d62801c2ced7260a37a2d0214edfe6528a9
        tag: v2.1.0
