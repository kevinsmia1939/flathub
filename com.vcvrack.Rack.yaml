app-id: com.vcvrack.Rack
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: 5.15-21.08
base: io.qt.qtwebengine.BaseApp
base-version: 5.15-21.08
rename-icon: rack
command: rack
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /etc
  - '*.la'
  - '*.a'

modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - shared-modules/linux-audio/jack2.json

  - name: NanoVG
    buildsystem: simple
    build-commands:
      - cp -r src/* /app/include
    sources:
      - type: git
        url: https://github.com/memononen/nanovg
        branches: master

  - name: NanoSVG
    buildsystem: simple
    build-commands:
      - cp -r src/* /app/include
    sources:
      - type: git
        url: https://github.com/memononen/nanosvg
        branches: master

  - name: bgfx
    buildsystem: simple
    build-commands:
      - cp -r examples/20-nanovg/blendish.h /app/include
    sources:
      - type: git
        url: https://github.com/bkaradzic/bgfx
        branches: master

  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DGLFW_USE_WAYLAND:BOOL=ON
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DGLFW_BUILD_EXAMPLES:BOOL=OFF
      - -DGLFW_BUILD_TESTS:BOOL=OFF
      - -DGLFW_BUILD_DOCS:BOOL=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.3.6/glfw-3.3.6.zip
        sha256: 45537305d44c0a9f3612d4ec4a48414547cf854bff3ed613078f7ec648a12781
        x-checker-data:
          type: anitya
          project-id: 1180
          stable-only: true
          url-template: https://github.com/glfw/glfw/releases/download/$version/glfw-$version.zip

  - name: jansson
    buildsystem: cmake-ninja
    config-opts:
      - -DJANSSON_BUILD_DOCS=OFF
    sources:
      - type: git
        url: https://github.com/akheron/jansson
        tag: v2.14
        commit: 684e18c927e89615c2d501737e90018f4930d6c5
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

  - name: Rack2
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make
      - make run
    sources:
      - type: git
        url: https://github.com/VCVRack/Rack
        #branches: v2
        commit: 30665d62801c2ced7260a37a2d0214edfe6528a9
        tag: v2.1.0

