app-id: com.vcvrack.Rack
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: 5.15-21.08
base: io.qt.qtwebengine.BaseApp
base-version: 5.15-21.08
rename-icon: rack
command: rack
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /etc
  - '*.la'
  - '*.a'

modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - shared-modules/linux-audio/jack2.json

  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DGLFW_USE_WAYLAND:BOOL=ON
      - -DBUILD_SHARED_LIBS:BOOL=ON
      - -DGLFW_BUILD_EXAMPLES:BOOL=OFF
      - -DGLFW_BUILD_TESTS:BOOL=OFF
      - -DGLFW_BUILD_DOCS:BOOL=OFF
    sources:
      - type: archive
        url: https://github.com/glfw/glfw/releases/download/3.3.6/glfw-3.3.6.zip
        sha256: 45537305d44c0a9f3612d4ec4a48414547cf854bff3ed613078f7ec648a12781
        x-checker-data:
          type: anitya
          project-id: 1180
          stable-only: true
          url-template: https://github.com/glfw/glfw/releases/download/$version/glfw-$version.zip

  - name: jansson
    buildsystem: cmake-ninja
    config-opts:
      - -DJANSSON_BUILD_DOCS=OFF
    sources:
      - type: git
        url: https://github.com/akheron/jansson
        tag: v2.14
        commit: 684e18c927e89615c2d501737e90018f4930d6c5
        x-checker-data:
          type: git
          tag-pattern: ^(v[\d.]+)$

  - name: speexdsp-SpeexDSP
    sources:
      - type: archive
        url: https://vcvrack.com/downloads/dep/speexdsp-SpeexDSP-1.2rc3.tgz
        sha256: c8dded1454747f65956f981c95e7f89a06abdaa2a53e8aeaa66bab2a3d59cebd

  - name: libsamplerate
    config-opts:
      - --disable-fftw
      - --disable-sndfile
    sources:
      - type: archive
        url: http://www.mega-nerd.com/SRC/libsamplerate-0.1.9.tar.gz
        sha256: 0a7eb168e2f21353fb6d84da152e4512126f7dc48ccb0be80578c565413444c1

