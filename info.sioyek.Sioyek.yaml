app-id: info.sioyek.Sioyek
runtime: org.kde.Platform
sdk: org.kde.Sdk
runtime-version: '5.15'
command: sioyek
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --share=network

cleanup:
  #- /include
  #- /lib/cmake
  #- /share/doc
  #- /doc
  #- "*.la"
  #- "*.a"
  # This fix Failed to find icon: Failed to find icon
  # https://github.com/hughsie/appstream-glib/issues/271
  #- /usr

modules:
  #- shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  #- shared-modules/libusb/libusb.json

  - name: Sioyek
    buildsystem: simple
    ensure-writable:
      - /bin
      - /share
    build-commands:
      - cd mupdf && make USE_SYSTEM_HARFBUZZ=yes
      - qmake pdf_viewer_build_config.pro
      - make
      - ls -l
      - cp {sioyek,mupdf} /app/bin
      - cp LICENSE /app/share/licenses/info.sioyek.Sioyek
      - mkdir build
      - cp sioyek build/sioyek
      - cp pdf_viewer/prefs.config build/prefs.config
      - cp pdf_viewer/prefs_user.config build/prefs_user.config
      - cp pdf_viewer/keys.config build/keys.config
      - cp pdf_viewer/keys_user.config build/keys_user.config
      - cp -r pdf_viewer/shaders build/shaders
      - cp tutorial.pdf build/tutorial.pdf
      - ls -l
    sources:
      - type: git
        url: git://github.com/ahrm/sioyek.git
        #tag: v0.31.5
        commit: 747f11beedf3d81d750ed8da1683718ea42ddf91
      - type: patch
        path: remove_g++.patch
