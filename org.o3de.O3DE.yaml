app-id: org.o3de.O3DE
runtime: org.freedesktop.Sdk
sdk: org.freedesktop.Sdk
runtime-version: '20.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm11
command: o3de
rename-desktop-file: o3de.desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
cleanup:
  #- /include
  #- /lib/cmake
  #- /share/doc
  #- /etc
  #- '*.la'
  #- '*.a'

modules:
  - shared-modules/glew/glew.json

  - name: O3DE
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCLANG_LINK_CLANG_DYLIB:BOOL=ON
    build-options:
      env:
        CC: clang
        CXX: clang++
        prepend-path: /usr/lib/sdk/llvm11/bin
        prepend-ld-library-path: /usr/lib/sdk/llvm11/lib
    sources:
      - type: git
        url: git://github.com/o3de/o3de.git
        tag: 2111.1
        commit: 1da5ef16a8f03ca76b0ed47cac21d18583ecab23

