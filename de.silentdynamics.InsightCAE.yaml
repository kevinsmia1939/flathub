  - name: InsightCAE
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DXFLIB_INCLUDE_DIR=/app/include/dxflib
      - -Wno-dev
    build-args:
      - --share=network
    sources:
      - type: git
        url: https://github.com/hkroeger/insightcae
        commit: 7d41a5555d0f8ed3e3b4233f2d1e11cac2c73f78
        branch: next-release
      - type: git
        url: https://github.com/dgobbi/vtk-dicom
        commit: 33d3f1cd2223a60a58ca0ca42face5315d69f7ca
        dest: vtk-dicom

