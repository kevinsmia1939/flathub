app-id: de.silentdynamics.InsightCAE
runtime: org.kde.Sdk
sdk: org.kde.Sdk
runtime-version: 5.15-24.08
base-version: 5.15-24.08
rename-icon: insightcae
command: insightcae
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=home
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - /etc
  - '*.la'
  - '*.a'

modules:
  - name: OpenBLAS
    no-autogen: true
    make-args:
      - DYNAMIC_ARCH=1
      - DYNAMIC_OLDER=1
      - FC=gfortran
      - TARGET=GENERIC
      - USE_OPENMP=0
    make-install-args:
      - PREFIX=/app
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/archive/v0.3.31.tar.gz
        sha512: 703b84c476c148a0922a04b1c33c9c4c452f478d608d93e59204b8f0f2c516344301ff0a4dbb3750a2449db0d28cc2df001c295898e859b41ecb8381f9c2eab8
        x-checker-data:
          type: anitya
          project-id: 2540
          url-template: https://github.com/OpenMathLib/OpenBLAS/archive/v$version.tar.gz

  - name: Armadillo
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://gitlab.com/conradsnicta/armadillo-code/-/archive/9.900.x/armadillo-code-9.900.x.tar.gz
        sha256: 40519374d2f2fd94308f19a86b325b7aea5b4701fdccef8d0d80624471f401c2

  - name: GSL
    buildsystem: autotools
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gsl/gsl-2.6.tar.gz
        sha256: b782339fc7a38fe17689cb39966c4d821236c28018b6593ddb6fd59ee40786a8

  - name: openmpi
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.4.tar.bz2
        sha256: 92912e175fd1234368c8730c03f4996fe5942e7479bb1d10059405e7f2b3930d

  - name: Boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install cxxflags="-std=c++14 $CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.65.1/source/boost_1_65_1.tar.gz
        sha256: a13de2c8fbad635e6ba9c8f8714a0e6b4264b60a29b964b940a22554705b6b60
      - type: patch
        path: boost-build-gcc-implicit-decl.patch
      - type: patch
        path: boost-python312.patch

  - name: VTK
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING:BOOL=OFF
      - -DVTK_GROUP_ENABLE_Qt:BOOL=YES
      - -DVTK_BUILD_COMPILE_TOOLS_ONLY:BOOL=OFF
      - -DVTK_DEFAULT_RENDER_WINDOW_OFFSCREEN:BOOL=ON
    sources:
      - type: archive
        url: https://www.vtk.org/files/release/9.4/VTK-9.4.1.tar.gz
        sha256: c253b0c8d002aaf98871c6d0cb76afc4936c301b72358a08d5f3f72ef8bc4529

  - name: libXmu
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.gz
        sha256: bf0902583dd1123856c11e0a5085bd3c6e9886fbbd44954464975fd7d52eb599

  - name: opencascade
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DUSE_VTK=ON
      - -DBUILD_DOC_Overview=OFF
      - -DBUILD_MODULE_Draw=OFF
      - -DVTK_DIR=/app/lib/cmake/vtk-9.4
      - -D3RDPARTY_VTK_INCLUDE_DIR=/app/include/vtk-9.4
      - -D3RDPARTY_VTK_LIBRARY_DIR=/app/lib
    sources:
      - type: git
        url: https://github.com/Open-Cascade-SAS/OCCT
        tag: V7_7_0
        commit: 185d29b92f6764ffa9fc195b7dbe7bba3c4ac855
      - type: patch
        path: freetype_use_unsigned_point_and_contour.patch

  - name: dxflib
    buildsystem: simple
    build-commands:
      - qmake dxflib.pro && make
      - mkdir -p /app/include/dxflib
      - cp src/* /app/include/dxflib
      - cp *.o libdxflib.a /app/lib/
    sources:
      - type: archive
        url: https://www.qcad.org/archives/dxflib/dxflib-3.7.5-src.tar.gz
        sha256: 3c76aa8f8c8491900458980daf500b55ae7d015e71f23ae3d0cfcd6c87deccd5

  - name: SWIG
    sources:
      - type: archive
        url: https://sourceforge.net/projects/swig/files/swig/swig-4.3.0/swig-4.3.0.tar.gz
        sha256: f7203ef796f61af986c70c05816236cbd0d31b7aa9631e5ab53020ab7804aa9e

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-25.02.0.tar.xz
        sha256: 21234cb2a9647d73c752ce4031e65a79d11a511a835f2798284c2497b8701dee
        x-checker-data:
          type: anitya
          project-id: 3686
          url-template: https://poppler.freedesktop.org/poppler-$version.tar.xz

  - name: minizip
    subdir: contrib/minizip
    sources:
        - type: git
          url: https://github.com/madler/zlib
          tag: v1.3.1
          commit: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
        - type: script
          dest: contrib/minizip/
          dest-filename: autogen.sh
          commands:
            - autoreconf -ifv

  # - name: VTK-DICOM
  #   buildsystem: cmake-ninja
  #   builddir: true
  #   config-opts:
  #     - -DBUILD_SHARED_LIBS=ON
  #     - -DBUILD_PYTHON_WRAPPERS=OFF
  #     - -DCMAKE_BUILD_TYPE=Release
  #     - -DVTK_VERSIONED_INSTALL=OFF
  #     - -DDICOM_CUSTOM_LIBRARY_SUFFIX=pvis
  #   sources:
  #     - type: git
  #       url: https://github.com/dgobbi/vtk-dicom
  #       commit: 33d3f1cd2223a60a58ca0ca42face5315d69f7ca



  - name: InsightCAE
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DXFLIB_INCLUDE_DIR=/app/include/dxflib
      - -Wno-dev
    sources:
      - type: git
        url: https://github.com/hkroeger/insightcae
        commit: ba427fb72b73e3511b3c238ecc84e43ca1b6c74a
        branch: next-release
      - type: patch
        path: insightcae-boost-scoped-enums.patch
      - type: patch
        path: insightcae-vtk-dicom-serialise.patch
      - type: patch
        path: insightcae-boost-io-context.patch
      - type: patch
        path: insightcae-vtk-dicom-include-dir.patch
      - type: git
        url: https://github.com/dgobbi/vtk-dicom
        commit: 33d3f1cd2223a60a58ca0ca42face5315d69f7ca
        dest: vtk-dicom
